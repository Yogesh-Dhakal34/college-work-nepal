<!DOCTYPE html>
<html lang="en">    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Form Example</title>
</head>
<body>
    <h1 style = "color: yellow; background-color: purple;">Form Example</h1>
    <form method="post" action="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Ftse3.mm.bing.net%2Fth%2Fid%2FOIP.dGNJGm-f5TtDIhhV-KVCGgHaH0%3Fcb%3Ddefcachec2%26pid%3DApi&f=1&ipt=08492bfb9e5e5cb84b40787effb79938597e849867396b375c5e9485a4962e87&ipo=images" enctype = "multipart/form-data">

        <img src = "https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Ftse1.mm.bing.net%2Fth%2Fid%2FOIP.SkVm5SugGURqLxZUqzj6jwHaHa%3Fpid%3DApi&f=1&ipt=c97edadd091787cff287582a1d12db479acf3f9971c479af9df959d8307b00ed&ipo=images" height = "320px" alt="Form Image" align = "right">


        <label for="fname">First Name: </label>
        <input type="text" id="fname" name="fname" placeholder="Enter First Name"><br><br>

        <label for="lname">Last Name: </label>
        <input type="text" id="lname" name="lname" placeholder="Enter Last Name"><br><br>

        <label for="email"> Personal Email: </label>
        <input type="email" id="email" name="email" placeholder="Enter your Email" maxlength="30" minlength="18" pattern="[a-z0-9   @gmail]+.com"><br><br>

        <label for="age"> Age: </label>
        <input type="number" id="age" name="age" placeholder="Enter your Age"> <br><br>

        <label for = "password"> Password: </label>
        <input type = "password" id = "password" name = "password" placeholder ="Enter your Password"> <br><br>
        
        <label for="tel">Mobile Number: </label>
        <input type="tel" id="tel" name="tel" placeholder="Enter your Mobile No."><br><br>

        <label for="dateofbirth"> Date of Birth: </label>
        <input type="date" id="dateofbirth" name="dateofbirth"> <br><br>

        <label for="country"> Country: </label>
        <select id="country" name="country">
            <option value="" disabled selected>Select the Country</option>
            <option value="USA">USA</option>
            <option value="Canada">Canada</option>
            <option value="UK">UK</option>
            <option value="Australia">Australia</option>
            <option value="Nepal">Nepal</option>
            <option value="Other">Other</option>
        </select>
        <br><br>

        <label for="province"> Province: </label>
        <select id="province" name="province">
            <option value="" disabled selected>Select the Province</option>
            <option value="Koshi">Koshi</option>
            <option value="Madesh">Madesh</option>
            <option value="Bagmati">Bagmati</option>
            <option value="Gandaki">Gandaki</option>
            <option value="Lumbini">Lumbini</option>
            <option value="Karnali">Karnali</option>
            <option value="Sudurpashchim">Sudurpashchim</option>
        </select>
        <br><br>

        <label for="address">Address: </label>
        <input type="text" id="address" name="address" placeholder="Enter your Current Address"><br><br>
        
        <fieldset>
            <legend>Gender</legend>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
        </fieldset>
        <br><br>

        <fieldset>
            <legend>Hobbies</legend>
            <input type="checkbox" id="hobby-reading" name="hobbies[]" value="Reading">
            <label for="hobby-reading">Reading</label>
            <input type="checkbox" id="hobby-traveling" name="hobbies[]" value="Traveling">
            <label for="hobby-traveling">Traveling</label>
            <input type="checkbox" id="hobby-gaming" name="hobbies[]" value="Gaming">
            <label for="hobby-gaming">Gaming</label>
        </fieldset>
        <br><br>

        <label for = "color"> Favorite Color: </label>
        <input type = "color" id = "color" name = "color"> <br><br>

        <label for="description"> Description: </label> <br>
        <textarea id="description" name="description" rows="5" cols="50" placeholder="Write something about yourself..."></textarea>

        <p>
            <label for = "attachment"> Choose File for CV </label><br><br>
            <input type="file" id="attachment" name="attachment" multiple>
        </p>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>
</body>
</html>
